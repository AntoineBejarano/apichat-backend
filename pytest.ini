[tool:pytest]
# 🧪 CONFIGURACIÓN DE PYTEST - SISTEMA EXPLORER/GUIDED

# Configuración básica
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    performance: marks tests as performance tests
    e2e: marks tests as end-to-end tests
    unit: marks tests as unit tests
    ai: marks tests related to AI services
    mode: marks tests related to mode detection and transitions
    cache: marks tests related to caching services
    monitoring: marks tests related to monitoring services

# Configuración de asyncio
asyncio_mode = auto

# Configuración de coverage y opciones generales
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=app
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=90
    --cov-branch
    --cov-config=.coveragerc
    --html=reports/pytest_report.html
    --self-contained-html
    --junitxml=reports/junit.xml

# Configuración de filtros
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:asyncio.*

# Configuración de timeouts
timeout = 300

# Configuración de logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Configuración de fixtures
usefixtures = setup_test_environment

# Configuración de minversion
minversion = 7.0

# Configuración de test discovery
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    venv
    env
    .env
    __pycache__
    .pytest_cache
    htmlcov
    reports
